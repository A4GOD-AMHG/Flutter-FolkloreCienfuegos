name: cienfuegos_folklore
description: "A Flutter project made by Alexis Manuel Hurtado Garcia, dev of Alabbi S.U.R.L."

publish_to: "none"

version: 1.1.0+2

environment:
  sdk: ^3.6.0

dependencies:
